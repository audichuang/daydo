<!DOCTYPE html>
<html lang="zh-Hant"><head>
<meta charset="utf-8">
<title>Doneday v2 · 清單抽屜</title>
<script src="e8acfd22-0fb4-4032-9aa9-90319583af7a"></script>
</head>
<body>
<x-dc>
<helmet>
<style>/*fonts*/</style>
<style>
body{margin:0}
button{font:inherit;color:inherit}
a{color:#FF9A3D}a:hover{color:#FFB46E}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #0E0F10; color: #F1F3F2; font-family: 'Inter', 'Noto Sans TC', system-ui, sans-serif; box-sizing: border-box">
  <div aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 390px; height: 844px; pointer-events: none">
    <dc-import name="V2Today" accent="{{accent}}" hint-size="390px,844px"></dc-import>
  </div>
  <a href="V2Today.dc.html" aria-label="關閉抽屜" style="position: absolute; left: 0; top: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.55)"></a>

  <nav aria-label="清單" style="position: absolute; left: 0; top: 0; bottom: 0; width: 316px; background: #141516; border-right: 1px solid #222426; border-radius: 0 24px 24px 0; display: flex; flex-direction: column; box-sizing: border-box">
    <div style="display: flex; align-items: center; gap: 10px; padding: 60px 12px 10px 18px">
      <span style="width: 36px; height: 36px; border-radius: 18px; background: #9BB8FF; color: #0E0F10; font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center">我</span>
      <span style="flex: 1; display: flex; flex-direction: column"><span style="font-size: 15px; font-weight: 600">[你的名字]</span><span style="font-size: 12px; color: #8A928F">已同步・剛剛</span></span>
      <button type="button" aria-label="搜尋" style="width: 40px; height: 40px; border: 0; border-radius: 20px; background: transparent; color: #C9CFCC; display: flex; align-items: center; justify-content: center"><svg width="19" height="19" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="M20 20l-4-4"></path></svg></button>
      <button type="button" aria-label="設定" style="width: 40px; height: 40px; border: 0; border-radius: 20px; background: transparent; color: #C9CFCC; display: flex; align-items: center; justify-content: center"><svg width="19" height="19" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"></path></svg></button>
    </div>

    <div style="flex: 1; overflow-y: auto; padding: 4px 10px 16px; display: flex; flex-direction: column; gap: 2px">
      <sc-for list="{{smart}}" as="r" hint-placeholder-count="5">
        <button type="button" sc-camel-on-click="{{r.pick}}" aria-current="{{r.cur}}" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border: 0; border-radius: 12px; background: {{r.bg}}; text-align: left">
          <span style="width: 22px; display: flex; justify-content: center; color: {{r.ic}}"><svg width="19" height="19" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{r.path}}"></path></svg></span>
          <span style="flex: 1; font-size: 15px; font-weight: {{r.fw}}">{{r.name}}</span>
          <span style="font-size: 13px; color: {{r.cc}}">{{r.count}}</span>
        </button>
      </sc-for>

      <div style="display: flex; align-items: center; justify-content: space-between; padding: 14px 6px 4px 12px; font-size: 12px; font-weight: 600; color: #8A928F">
        <span>清單</span>
        <button type="button" aria-label="新增清單或資料夾" style="width: 32px; height: 32px; border: 0; border-radius: 16px; background: transparent; color: #C9CFCC; display: flex; align-items: center; justify-content: center"><svg width="17" height="17" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
      </div>

      <sc-for list="{{folders}}" as="f" hint-placeholder-count="2">
        <div style="display: flex; flex-direction: column">
          <button type="button" sc-camel-on-click="{{f.toggle}}" aria-expanded="{{f.exp}}" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border: 0; border-radius: 12px; background: transparent; text-align: left">
            <span style="width: 22px; display: flex; justify-content: center; color: #9BA3A0"><svg width="19" height="19" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 7.5a2 2 0 0 1 2-2h4l2 2h7a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"></path></svg></span>
            <span style="flex: 1; font-size: 15px">{{f.name}}</span>
            <span style="font-size: 13px; color: #8A928F">{{f.count}}</span>
            <svg width="14" height="14" sc-camel-view-box="0 0 24 24" fill="none" stroke="#8A928F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="transform: rotate({{f.rot}})"><path d="M9 6l6 6-6 6"></path></svg>
          </button>
          <sc-if value="{{f.open}}" hint-placeholder-val="{{true}}">
            <div style="display: flex; flex-direction: column; gap: 2px; padding-left: 22px">
              <sc-for list="{{f.lists}}" as="l" hint-placeholder-count="2">
                <button type="button" sc-camel-on-click="{{l.pick}}" aria-current="{{l.cur}}" style="display: flex; align-items: center; gap: 12px; min-height: 42px; padding: 0 12px; border: 0; border-radius: 12px; background: {{l.bg}}; text-align: left">
                  <span style="width: 10px; height: 10px; border-radius: 3px; background: {{l.c}}"></span>
                  <span style="flex: 1; font-size: 15px; font-weight: {{l.fw}}">{{l.name}}</span>
                  <span style="font-size: 13px; color: {{l.cc}}">{{l.count}}</span>
                </button>
              </sc-for>
            </div>
          </sc-if>
        </div>
      </sc-for>

      <sc-for list="{{loose}}" as="l" hint-placeholder-count="1">
        <a href="{{l.href}}" aria-current="{{l.cur}}" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 12px; background: {{l.bg}}; text-decoration: none; color: #F1F3F2">
          <span style="width: 22px; display: flex; justify-content: center"><span style="width: 10px; height: 10px; border-radius: 3px; background: {{l.c}}"></span></span>
          <span style="flex: 1; font-size: 15px">{{l.name}}</span>
          <span aria-label="共享清單" style="display: flex; align-items: center; color: #9BA3A0"><svg width="16" height="16" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><circle cx="9" cy="8.5" r="3.2"></circle><path d="M3 19.5c.8-3.2 3.2-5 6-5s5.2 1.8 6 5M16 5.5a3 3 0 0 1 0 6M17.5 14.6c1.8.6 3 2.4 3.5 4.9"></path></svg></span>
          <span style="font-size: 13px; color: #8A928F">{{l.count}}</span>
        </a>
      </sc-for>

      <div style="padding: 14px 6px 4px 12px; font-size: 12px; font-weight: 600; color: #8A928F">標籤</div>
      <div style="display: flex; flex-wrap: wrap; gap: 6px; padding: 0 12px">
        <span style="font-size: 13px; padding: 6px 10px; border-radius: 999px; background: #1F2123; color: #C9CFCC"># 客戶</span>
        <span style="font-size: 13px; padding: 6px 10px; border-radius: 999px; background: #1F2123; color: #C9CFCC"># 會議</span>
        <span style="font-size: 13px; padding: 6px 10px; border-radius: 999px; background: #1F2123; color: #C9CFCC"># 刷題</span>
      </div>
    </div>

    <div style="display: flex; gap: 6px; padding: 10px 12px 34px; border-top: 1px solid #222426">
      <button type="button" style="flex: 1; height: 44px; border: 0; border-radius: 12px; background: #1C1E20; font-size: 14px; color: #C9CFCC">已完成</button>
      <button type="button" style="flex: 1; height: 44px; border: 0; border-radius: 12px; background: #1C1E20; font-size: 14px; color: #C9CFCC">垃圾桶</button>
    </div>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script="" data-props="{&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#FF8A1E&quot;,&quot;options&quot;:[&quot;#FF8A1E&quot;,&quot;#4772FA&quot;,&quot;#2BB673&quot;,&quot;#8B6CE8&quot;]},&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844}}">
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { cur: 'today', open: { wf: true, life: false } }; }
  renderVals() {
    const accent = this.props.accent ?? '#FF8A1E';
    const onAccent = (() => { const v = [1, 3, 5].map((i) => { const c = parseInt(accent.slice(i, i + 2), 16) / 255; return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); }); return (0.2126 * v[0] + 0.7152 * v[1] + 0.0722 * v[2]) > 0.3 ? '#1A1206' : '#FFFFFF'; })();
    const mix = (h, p) => '#' + [1, 3, 5].map((i) => Math.round(parseInt(h.slice(i, i + 2), 16) * (1 - p) + 255 * p).toString(16).padStart(2, '0')).join('');
    const accentText = mix(accent, 0.1);
    const s = this.state;
    const act = (id) => ({ cur: s.cur === id ? 'page' : 'false', bg: s.cur === id ? accent + '2E' : 'transparent', fw: s.cur === id ? '700' : '400', cc: s.cur === id ? accentText : '#8A928F', pick: () => this.setState({ cur: id }) });
    const SM = [
      ['today', '今天', 6, 'M12 3.5v2M12 18.5v2M3.5 12h2M18.5 12h2M6 6l1.4 1.4M16.6 16.6L18 18M6 18l1.4-1.4M16.6 7.4L18 6M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8z'],
      ['tmr', '明天', 3, 'M4 12h13M13 7l5 5-5 5'],
      ['week', '未來 7 天', 11, 'M3.5 6.5a2 2 0 0 1 2-2h13a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2zM3.5 10h17M8 14h8'],
      ['inbox', '收件匣', 2, 'M3.5 13h4.5l1.5 3h5l1.5-3h4.5M5.5 5h13l2 8v6h-17v-6z'],
      ['mine', '指派給我', 4, 'M12 8a3.5 3.5 0 1 0 0 .01M5 20c1-3.5 3.8-5.5 7-5.5s6 2 7 5.5']
    ];
    const smart = SM.map((r) => Object.assign({ name: r[1], count: r[2], path: r[3], ic: s.cur === r[0] ? accentText : '#9BA3A0' }, act(r[0])));
    const F = [
      ['wf', '工作與學習', [['work', '工作', '#4AA8E8', 7], ['study', '學習', '#4FC3A1', 2]]],
      ['life', '生活', [['life', '個人', '#E98A5B', 4], ['shop', '購物', '#C77DDB', 1]]]
    ];
    const folders = F.map((f) => ({
      name: f[1], count: f[2].reduce((a, l) => a + l[3], 0), open: !!s.open[f[0]], exp: s.open[f[0]] ? 'true' : 'false', rot: s.open[f[0]] ? '90deg' : '0deg',
      toggle: () => this.setState((st) => ({ open: Object.assign({}, st.open, { [f[0]]: !st.open[f[0]] }) })),
      lists: f[2].map((l) => Object.assign({ name: l[1], c: l[2], count: l[3] }, act(l[0])))
    }));
    const loose = [Object.assign({ name: '我們的行程', c: '#E8C14E', count: 6, href: '#' }, act('ours'))];
    return { onAccent, accent, smart, folders, loose };
  }
}
</script>


</body></html>
