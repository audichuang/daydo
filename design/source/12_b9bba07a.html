<!DOCTYPE html>
<html lang="zh-Hant"><head>
<meta charset="utf-8">
<title>Doneday v2 · 編輯清單</title>
<script src="1e901b94-c0bb-43ba-9170-a78fe51a1ff4"></script>
</head>
<body>
<x-dc>
<helmet>
<style>/*fonts*/</style>
<style>
body{margin:0}
button,input{font:inherit;color:inherit}
a{color:#FF9A3D}a:hover{color:#FFB46E}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #0E0F10; color: #F1F3F2; font-family: 'Inter', 'Noto Sans TC', system-ui, sans-serif; box-sizing: border-box">
  <section role="dialog" aria-label="編輯清單" style="position: absolute; left: 0; right: 0; top: 50px; bottom: 0; border-radius: 28px 28px 0 0; background: #141516; border-top: 1px solid #26282A; display: flex; flex-direction: column; overflow: hidden">
    <div style="flex: 0 0 auto; display: flex; align-items: center; gap: 8px; height: 64px; padding: 8px 14px 0">
      <a href="V2Drawer.dc.html" style="height: 38px; padding: 0 14px; border-radius: 19px; background: #232527; font-size: 14px; font-weight: 600; color: #E6E9E8; text-decoration: none; display: flex; align-items: center">取消</a>
      <h1 style="flex: 1; margin: 0; text-align: center; font-size: 16px; font-weight: 700">編輯清單</h1>
      <button type="button" sc-camel-on-click="{{save}}" aria-disabled="{{saveDisabled}}" style="height: 38px; padding: 0 16px; border: 0; border-radius: 19px; background: {{saveBg}}; color: {{saveFg}}; font-size: 14px; font-weight: 700">{{saveLabel}}</button>
    </div>

    <div style="flex: 1; overflow-y: auto; padding: 8px 16px 40px; display: flex; flex-direction: column; gap: 14px">
      <div style="display: flex; align-items: center; gap: 12px; padding: 8px 10px 8px 8px; border-radius: 16px; background: #1F2123">
        <button type="button" aria-label="更換圖示" style="flex: 0 0 auto; width: 44px; height: 44px; border: 0; border-radius: 12px; background: {{colorSoft}}; color: {{colorText}}; display: flex; align-items: center; justify-content: center">
          <svg width="22" height="22" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><circle cx="9" cy="8.5" r="3.2"></circle><path d="M3 19.5c.8-3.2 3.2-5 6-5s5.2 1.8 6 5M16 5.5a3 3 0 0 1 0 6M17.5 14.6c1.8.6 3 2.4 3.5 4.9"></path></svg>
        </button>
        <label style="flex: 1; min-width: 0; display: flex">
          <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">清單名稱</span>
          <input type="text" value="{{name}}" sc-camel-on-change="{{onName}}" style="flex: 1; min-width: 0; height: 44px; border: 0; outline: none; background: transparent; font-size: 17px; font-weight: 600">
        </label>
        <button type="button" sc-camel-on-click="{{clearName}}" aria-label="清除名稱" style="width: 32px; height: 32px; border: 0; border-radius: 16px; background: #33363A; color: #C9CFCC; display: flex; align-items: center; justify-content: center"><svg width="12" height="12" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
      </div>

      <div style="display: flex; flex-direction: column; gap: 10px; padding: 12px 14px 14px; border-radius: 16px; background: #1F2123">
        <span style="font-size: 13px; font-weight: 600; color: #9BA3A0">檢視</span>
        <div role="radiogroup" aria-label="檢視" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
          <sc-for list="{{views}}" as="v" hint-placeholder-count="3">
            <button type="button" role="radio" aria-checked="{{v.on}}" sc-camel-on-click="{{v.pick}}" style="display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 0; border: 0; background: transparent">
              <span style="position: relative; width: 100%; height: 60px; border-radius: 10px; border: 2px solid {{v.ring}}; background: #17181A; padding: 7px; box-sizing: border-box; display: flex; gap: 3px; flex-direction: {{v.dir}}">
                <sc-for list="{{v.bars}}" as="b" hint-placeholder-count="3"><span style="flex: {{b.f}}; border-radius: 3px; background: {{b.c}}; margin-left: {{b.ml}}"></span></sc-for>
                <sc-if value="{{v.sel}}" hint-placeholder-val="{{false}}"><span style="position: absolute; right: -6px; top: -6px; width: 18px; height: 18px; border-radius: 9px; background: {{accent}}; color: {{onAccent}}; display: flex; align-items: center; justify-content: center"><svg width="10" height="10" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span></sc-if>
              </span>
              <span style="font-size: 13px; font-weight: {{v.fw}}; color: {{v.fg}}">{{v.name}}</span>
            </button>
          </sc-for>
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 10px; padding: 12px 14px; border-radius: 16px; background: #1F2123">
        <span style="font-size: 13px; font-weight: 600; color: #9BA3A0">顏色</span>
        <div role="radiogroup" aria-label="清單顏色" style="display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 4px">
          <sc-for list="{{colors}}" as="c" hint-placeholder-count="8">
            <button type="button" role="radio" aria-checked="{{c.on}}" aria-label="{{c.n}}" sc-camel-on-click="{{c.pick}}" style="height: 40px; padding: 0; border: 0; background: transparent; display: flex; align-items: center; justify-content: center">
              <span style="width: 32px; height: 32px; border-radius: 16px; box-sizing: border-box; border: 2.5px solid {{c.ring}}; display: flex; align-items: center; justify-content: center"><span style="width: 24px; height: 24px; border-radius: 12px; background: {{c.h}}"></span></span>
            </button>
          </sc-for>
        </div>
      </div>

      <sc-for list="{{groups}}" as="g" hint-placeholder-count="2">
        <div style="display: flex; flex-direction: column; gap: 6px">
          <span style="padding: 0 6px; font-size: 12px; font-weight: 600; color: #8A928F">{{g.title}}</span>
          <div style="display: flex; flex-direction: column; border-radius: 16px; background: #1F2123; padding: 0 14px">
            <sc-for list="{{g.rows}}" as="r" hint-placeholder-count="3">
              <button type="button" style="display: flex; align-items: center; gap: 10px; min-height: 50px; padding: 0; border: 0; border-top: {{r.sep}}; background: transparent; text-align: left">
                <span style="flex: 1; font-size: 15px">{{r.l}}</span>
                <sc-if value="{{r.isMembers}}" hint-placeholder-val="{{false}}">
                  <span style="display: flex; padding-left: 4px"><span style="width: 24px; height: 24px; border-radius: 12px; background: #9BB8FF; color: #0E0F10; font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center">我</span><span style="width: 24px; height: 24px; margin-left: -6px; border-radius: 12px; border: 2px solid #1F2123; background: #FF9FC2; color: #0E0F10; font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center; box-sizing: border-box">安</span></span>
                </sc-if>
                <span style="font-size: 14px; color: #9BA3A0">{{r.v}}</span>
                <svg width="13" height="13" sc-camel-view-box="0 0 24 24" fill="none" stroke="#6E7673" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
              </button>
            </sc-for>
          </div>
        </div>
      </sc-for>

      <div style="display: flex; flex-direction: column; border-radius: 16px; background: #1F2123; padding: 0 14px; margin-top: 6px">
        <button type="button" style="min-height: 50px; padding: 0; border: 0; background: transparent; text-align: left; font-size: 15px; color: #E6E9E8">封存清單</button>
        <button type="button" style="min-height: 50px; padding: 0; border: 0; border-top: 1px solid #2A2C2E; background: transparent; text-align: left; font-size: 15px; color: #FF7A70">刪除清單</button>
      </div>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script="" data-props="{&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#FF8A1E&quot;,&quot;options&quot;:[&quot;#FF8A1E&quot;,&quot;#4772FA&quot;,&quot;#2BB673&quot;,&quot;#8B6CE8&quot;]},&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844}}">
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { name: '我們的行程', color: '#E8C14E', view: 0, dirty: false, saved: false }; }
  renderVals() {
    const accent = this.props.accent ?? '#FF8A1E';
    const onAccent = (() => { const v = [1, 3, 5].map((i) => { const c = parseInt(accent.slice(i, i + 2), 16) / 255; return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); }); return (0.2126 * v[0] + 0.7152 * v[1] + 0.0722 * v[2]) > 0.3 ? '#1A1206' : '#FFFFFF'; })();
    const mix = (h, p) => '#' + [1, 3, 5].map((i) => Math.round(parseInt(h.slice(i, i + 2), 16) * (1 - p) + 255 * p).toString(16).padStart(2, '0')).join('');
    const s = this.state;
    const C = [['無', '#5B6461'], ['紅', '#F2555A'], ['橘', '#E98A5B'], ['黃', '#E8C14E'], ['綠', '#4FC3A1'], ['天藍', '#4AA8E8'], ['靛', '#4E8BF7'], ['紫', '#C77DDB']];
    const V = [
      ['列表', 'column', [[1, '#3A3D40', '0'], [1, '#3A3D40', '0'], [1, '#3A3D40', '0']]],
      ['看板', 'row', [[1, '#3A3D40', '0'], [1, '#3A3D40', '0'], [1, '#3A3D40', '0']]],
      ['時間軸', 'column', [[1, '#3A3D40', '0'], [1, '#3A3D40', '18px'], [1, '#3A3D40', '8px']]]
    ];
    const dirty = (patch) => this.setState(Object.assign({ dirty: true, saved: false }, patch));
    return { onAccent,
      accent, name: s.name, colorSoft: s.color + '33', colorText: mix(s.color, 0.3),
      onName: (e) => dirty({ name: e.target.value }), clearName: () => dirty({ name: '' }),
      saveLabel: s.saved && !s.dirty ? '已儲存' : '儲存', saveDisabled: s.dirty ? 'false' : 'true', saveBg: s.dirty ? accent : '#26282A', saveFg: s.dirty ? onAccent : '#737B78',
      save: () => { if (this.state.dirty) this.setState({ dirty: false, saved: true }); },
      views: V.map((v, i) => ({ name: v[0], dir: v[1], sel: s.view === i, on: s.view === i ? 'true' : 'false', ring: s.view === i ? accent : '#2A2C2E', fw: s.view === i ? '700' : '400', fg: s.view === i ? '#F1F3F2' : '#9BA3A0',
        bars: v[2].map((b) => ({ f: String(b[0]), c: s.view === i ? s.color + '88' : b[1], ml: b[2] })), pick: () => dirty({ view: i }) })),
      colors: C.map((c) => ({ n: c[0], h: c[1], on: s.color === c[1] ? 'true' : 'false', ring: s.color === c[1] ? '#F1F3F2' : 'transparent', pick: () => dirty({ color: c[1] }) })),
      groups: [
        { title: '成員與通知', rows: [['成員', '2 位', true], ['提醒與通知', '有變更時通知'], ['轉移清單擁有者', '']] },
        { title: '整理', rows: [['資料夾', '生活'], ['清單類型', '任務清單'], ['在智慧清單中顯示', '所有任務']] }
      ].map((g) => ({ title: g.title, rows: g.rows.map((r, i) => ({ l: r[0], v: r[1], isMembers: !!r[2], sep: i === 0 ? '0' : '1px solid #2A2C2E' })) }))
    };
  }
}
</script>


</body></html>
