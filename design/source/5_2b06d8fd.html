<!DOCTYPE html>
<html lang="zh-Hant"><head>
<meta charset="utf-8">
<title>Doneday v2 · 事件月曆</title>
<script src="6969fd39-0311-4987-881f-947da95415d7"></script>
</head>
<body>
<x-dc>
<helmet>
<style>/*fonts*/</style>
<style>
body{margin:0}
button{font:inherit;color:inherit}
a{color:#FF9A3D}a:hover{color:#FFB46E}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #0E0F10; color: #F1F3F2; font-family: 'Inter', 'Noto Sans TC', system-ui, sans-serif; box-sizing: border-box">

  <div style="position: absolute; left: 0; top: 0; right: 0; bottom: 0; overflow-y: auto; overflow-x: hidden; padding: 108px 6px 190px; box-sizing: border-box; display: flex; flex-direction: column; gap: 8px">
    <div role="group" aria-label="篩選" style="display: flex; gap: 6px; padding: 0 10px; flex-wrap: wrap">
      <sc-for list="{{filters}}" as="f" hint-placeholder-count="3">
        <button type="button" aria-pressed="{{f.pressed}}" sc-camel-on-click="{{f.pick}}" style="display: flex; align-items: center; gap: 5px; height: 32px; padding: 0 12px 0 {{f.pl}}; border: 1px solid {{f.bd}}; border-radius: 16px; background: {{f.bg}}; color: {{f.fg}}; font-size: 13px; font-weight: 600">
          <sc-if value="{{f.hasAv}}" hint-placeholder-val="{{false}}"><span style="width: 22px; height: 22px; border-radius: 11px; background: {{f.c}}; color: #0E0F10; font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center">{{f.i}}</span></sc-if>{{f.label}}
        </button>
      </sc-for>
      <button type="button" style="display: flex; align-items: center; gap: 4px; height: 32px; padding: 0 10px 0 12px; border: 1px solid #26282A; border-radius: 16px; background: transparent; color: #C9CFCC; font-size: 13px">清單：全部<svg width="12" height="12" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></button>
    </div>
    <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); text-align: center">
      <sc-for list="{{wd}}" as="w" hint-placeholder-count="7"><span style="font-size: 12px; color: #8A928F">{{w.n}}</span></sc-for>
    </div>
    <div style="display: flex; flex-direction: column; border-radius: 16px; background: #141516; overflow: hidden">
      <sc-for list="{{weeks}}" as="wk" hint-placeholder-count="5">
        <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); grid-template-rows: 30px 18px 18px 18px 16px; row-gap: 2px; padding-bottom: 6px; border-top: {{wk.sep}}; position: relative">
          <sc-for list="{{wk.days}}" as="d" hint-placeholder-count="7">
            <button type="button" sc-camel-on-click="{{d.pick}}" aria-label="{{d.aria}}" aria-pressed="{{d.pressed}}" style="grid-row: 1 / 6; grid-column: {{d.col}}; margin: 0; padding: 4px 0 0; border: 0; border-left: {{d.bl}}; background: {{d.cellBg}}; display: flex; justify-content: center; align-items: flex-start; opacity: {{d.op}}">
              <span style="width: 24px; height: 24px; border-radius: 12px; box-sizing: border-box; border: 1.5px solid {{d.ring}}; background: {{d.bg}}; color: {{d.fg}}; font-size: 12px; font-weight: {{d.fw}}; display: flex; align-items: center; justify-content: center">{{d.n}}</span>
            </button>
          </sc-for>
          <sc-for list="{{wk.bars}}" as="b" hint-placeholder-count="3">
            <span style="grid-column: {{b.gc}}; grid-row: {{b.gr}}; margin: 0 2px; padding: 0 4px; border-radius: 4px; background: {{b.bg}}; color: {{b.fg}}; font-size: 10.5px; font-weight: 600; line-height: 18px; white-space: nowrap; overflow: hidden; text-overflow: clip; pointer-events: none; text-decoration: {{b.deco}}">{{b.t}}</span>
          </sc-for>
          <sc-for list="{{wk.more}}" as="m" hint-placeholder-count="1">
            <span style="grid-column: {{m.gc}}; grid-row: 5; padding: 0 5px; font-size: 10px; font-weight: 600; line-height: 16px; color: #9BA3A0; pointer-events: none">＋{{m.n}} 項</span>
          </sc-for>
        </div>
      </sc-for>
    </div>
    <div style="display: flex; gap: 12px; flex-wrap: wrap; padding: 6px 12px; font-size: 11px; color: #8A928F">
      <sc-for list="{{legend}}" as="g" hint-placeholder-count="5"><span style="display: flex; align-items: center; gap: 5px"><span style="width: 8px; height: 8px; border-radius: 2px; background: {{g.c}}"></span>{{g.n}}</span></sc-for>
    </div>
  </div>

  <a href="V2CalAgenda.dc.html" style="position: absolute; left: 16px; right: 16px; bottom: 104px; display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 0 16px; border-radius: 16px; background: #1C1D1F; border: 1px solid #2A2C2E; text-decoration: none; color: #F1F3F2; box-sizing: border-box">
    <span style="flex: 1; display: flex; flex-direction: column"><span style="font-size: 15px; font-weight: 700">{{selTitle}}</span><span style="font-size: 12px; color: #9BA3A0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{selSummary}}</span></span>
    <span style="font-size: 13px; font-weight: 600; color: {{accentText}}">查看議程</span>
  </a>

  <div aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 0; height: 104px; background: linear-gradient(#0E0F10 55%, rgba(14,15,16,0)); pointer-events: none"></div>
  <header style="position: absolute; left: 16px; right: 16px; top: 54px; display: flex; align-items: center; gap: 8px">
    <a href="V2Drawer.dc.html" aria-label="開啟清單抽屜" style="width: 44px; height: 44px; border-radius: 22px; color: #F1F3F2; display: flex; align-items: center; justify-content: center; background: rgba(40,42,44,0.78); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,0.08); box-sizing: border-box">
      <svg width="20" height="20" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg>
    </a>
    <span style="flex: 1; text-align: center; font-size: 18px; font-weight: 700">2026 年 11 月</span>
    <div style="display: flex; align-items: center; height: 44px; padding: 0 2px; border-radius: 22px; background: rgba(40,42,44,0.78); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,0.08); box-sizing: border-box">
      <a href="V2Task.dc.html" aria-label="新增行程" style="width: 42px; height: 40px; border-radius: 20px; color: {{accentText}}; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></a>
      <a href="V2CalAgenda.dc.html" aria-label="切換為日期格＋議程" style="width: 42px; height: 40px; border-radius: 20px; color: #F1F3F2; display: flex; align-items: center; justify-content: center"><svg width="19" height="19" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="8" rx="2.5"></rect><path d="M4 16h16M4 20h10"></path></svg></a>
    </div>
  </header>

  <nav aria-label="主要功能" style="position: absolute; left: 16px; right: 16px; bottom: 30px; height: 62px; padding: 5px; border-radius: 31px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 2px; background: rgba(36,38,40,0.82); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); border: 1px solid rgba(255,255,255,0.08); box-shadow: 0 8px 24px rgba(0,0,0,0.35); box-sizing: border-box">
    <a href="V2Today.dc.html" style="border-radius: 26px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11px; text-decoration: none; color: #C9CFCC"><svg width="22" height="22" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="5"></rect><path d="M8.5 12l2.5 2.5L15.5 10"></path></svg>任務</a>
    <a href="V2CalAgenda.dc.html" aria-current="page" style="border-radius: 26px; background: rgba(255,255,255,0.08); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11px; font-weight: 600; text-decoration: none; color: {{accentText}}"><svg width="22" height="22" sc-camel-view-box="0 0 24 24" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="16" rx="3.5" fill="none" stroke="currentColor" stroke-width="1.9"></rect><path d="M3.5 9h17M8 2.8v3.4M16 2.8v3.4" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"></path><text x="12" y="17.8" text-anchor="middle" font-size="8.5" font-weight="700" fill="currentColor" font-family="Inter, sans-serif">15</text></svg>日曆</a>
    <a href="#" style="border-radius: 26px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11px; text-decoration: none; color: #C9CFCC"><svg width="22" height="22" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><circle cx="9" cy="8.5" r="3.2"></circle><path d="M3 19.5c.8-3.2 3.2-5 6-5s5.2 1.8 6 5M16 5.5a3 3 0 0 1 0 6M17.5 14.6c1.8.6 3 2.4 3.5 4.9"></path></svg>共享</a>
    <a href="#" style="border-radius: 26px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11px; text-decoration: none; color: #C9CFCC"><svg width="22" height="22" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="M20 20l-4-4"></path></svg>搜尋</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script="" data-props="{&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#FF8A1E&quot;,&quot;options&quot;:[&quot;#FF8A1E&quot;,&quot;#4772FA&quot;,&quot;#2BB673&quot;,&quot;#8B6CE8&quot;]},&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844}}">
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { sel: 16, f: 'all', done: { t13: true } }; }
  renderVals() {
    const accent = this.props.accent ?? '#FF8A1E';
    const onAccent = (() => { const v = [1, 3, 5].map((i) => { const c = parseInt(accent.slice(i, i + 2), 16) / 255; return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); }); return (0.2126 * v[0] + 0.7152 * v[1] + 0.0722 * v[2]) > 0.3 ? '#1A1206' : '#FFFFFF'; })();
    const mix = (h, p) => '#' + [1, 3, 5].map((i) => Math.round(parseInt(h.slice(i, i + 2), 16) * (1 - p) + 255 * p).toString(16).padStart(2, '0')).join('');
    const accentText = mix(accent, 0.1);
    const s = this.state;
    const LISTS = { work: ['工作', '#4AA8E8'], life: ['個人', '#E98A5B'], shop: ['購物', '#C77DDB'], study: ['學習', '#4FC3A1'], ours: ['我們的行程', '#E8C14E'] };
    const MEM = { me: ['我', '#9BB8FF'], an: ['安', '#FF9FC2'] };
    const TODAY = 15;
    const EV = [
      ['e3', '週會', '', 'work', 2, 2, 600, 660], ['e1', '週會', '', 'work', 9, 9, 600, 660], ['e2', '讀書會', '', 'study', 11, 11, 1200, 1290],
      ['t6', '花蓮小旅行', '火車票已訂，民宿待確認', 'ours', 13, 16, null, null, ['me', 'an'], 6],
      ['t1', '回覆客戶報價信，並附上修訂後的合約條款與付款時程說明', '確認折扣條件後再寄出，副本給主管', 'work', 14, 14, 1020, null],
      ['t3', '去全聯買菜', '', 'shop', 15, 15, null, null], ['t13', '預約牙醫洗牙', '', 'life', 15, 15, null, null],
      ['t2', '準備週一產品會議簡報', '重點放在 Q4 上線時程與待決事項', 'work', 15, 15, 1080, 1110],
      ['t5', '晚餐：巷口火鍋', '記得先訂位，四個人', 'ours', 15, 15, 1140, 1260, ['me', 'an'], 3],
      ['t4', '健身房 — 腿部訓練', '深蹲 5×5、硬舉 3×5、伸展 10 分鐘', 'life', 15, 15, 1170, 1230],
      ['t8', '週會', '', 'work', 16, 16, 600, 660], ['t9', '繳信用卡帳單', '', 'life', 16, 16, null, null],
      ['t7', 'Day 3｜Two Pointers 練習', '完成 3 題，記錄是否使用提示與解題時間', 'study', 16, 16, 1260, 1320],
      ['t10', '小安 台中出差', '', 'ours', 17, 19, null, null, ['an']], ['e7', '交 Q4 報告', '', 'work', 20, 20, null, null],
      ['t11', '媽媽生日', '訂蛋糕、買花', 'ours', 22, 22, null, null, ['me', 'an']], ['e6', '週會', '', 'work', 23, 23, 600, 660],
      ['e5', '年度健康檢查', '前一晚 10 點後禁食', 'life', 27, 27, 540, 660], ['t12', '搬家整理：打包書櫃', '', 'ours', 28, 29, null, null, ['me', 'an']],
      ['e8', '週會', '', 'work', 30, 30, 600, 660]
    ];
    const pass = (e) => s.f === 'all' || (s.f === 'me' ? (!e[8] || e[8].indexOf('me') >= 0) : (!!e[8] && e[8].indexOf('an') >= 0));
    const ev = EV.filter(pass);
    const wdN = ['日', '一', '二', '三', '四', '五', '六'];
    const weeks = [];
    for (let w = 0; w < 5; w++) {
      const first = w * 7 + 1, last = first + 6;
      const days = [];
      for (let c = 0; c < 7; c++) {
        const n = first + c; const inM = n <= 30; const lbl = inM ? n : n - 30;
        const sel = inM && n === s.sel; const today = inM && n === TODAY;
        days.push({ col: String(c + 1), n: String(lbl), aria: (inM ? '11 月 ' : '12 月 ') + lbl + ' 日', pressed: sel ? 'true' : 'false', op: inM ? '1' : '0.38',
          bl: c === 0 ? '0' : '1px solid #1E2022', cellBg: sel ? accent + '1F' : 'transparent',
          bg: sel ? accent : 'transparent', ring: sel ? accent : (today ? accentText : 'transparent'), fg: sel ? onAccent : (today ? accentText : '#E6E9E8'), fw: sel || today ? '700' : '500',
          pick: () => { if (inM) this.setState({ sel: n }); } });
      }
      const lanes = []; const bars = []; const hidden = {};
      ev.filter((e) => e[4] <= last && e[5] >= first)
        .sort((a, b) => (b[5] - b[4]) - (a[5] - a[4]) || a[4] - b[4] || (a[6] === null ? -1 : a[6]) - (b[6] === null ? -1 : b[6]))
        .forEach((e) => {
          const a = Math.max(e[4], first) - first + 1, b = Math.min(e[5], last) - first + 1;
          let lane = 0;
          while (lanes[lane] && lanes[lane].some((r) => !(b < r[0] || a > r[1]))) lane++;
          if (lane > 2) { for (let k = a; k <= b; k++) hidden[k] = (hidden[k] || 0) + 1; return; }
          (lanes[lane] = lanes[lane] || []).push([a, b]);
          const col = LISTS[e[3]][1]; const done = !!s.done[e[0]];
          const cont = e[4] < first ? '‹ ' : '';
          bars.push({ t: cont + e[1], gc: a + ' / span ' + (b - a + 1), gr: String(lane + 2), bg: done ? '#26282A' : col + '38', fg: done ? '#7A827F' : mix(col, 0.45), deco: done ? 'line-through' : 'none' });
        });
      const more = Object.keys(hidden).map((k) => ({ gc: String(k), n: hidden[k] }));
      weeks.push({ days, bars, more, sep: w === 0 ? '0' : '1px solid #1E2022' });
    }
    const dayEv = ev.filter((e) => e[4] <= s.sel && e[5] >= s.sel);
    const F = [['all', '全部', null], ['me', '我參與', 'me'], ['an', '小安', 'an']];
    return { onAccent,
      accent, accentText, weeks,
      wd: wdN.map((n) => ({ n })),
      legend: Object.keys(LISTS).map((k) => ({ n: LISTS[k][0], c: LISTS[k][1] })),
      selTitle: '11 月 ' + s.sel + ' 日 週' + wdN[(s.sel - 1) % 7] + '・' + dayEv.length + ' 項',
      selSummary: dayEv.length ? dayEv.map((e) => e[1]).join('、') : '沒有項目',
      filters: F.map((f) => ({ label: f[1], hasAv: !!f[2], i: f[2] ? MEM[f[2]][0] : '', c: f[2] ? MEM[f[2]][1] : '', pl: f[2] ? '5px' : '12px', pressed: s.f === f[0] ? 'true' : 'false', bg: s.f === f[0] ? '#F1F3F2' : 'transparent', bd: s.f === f[0] ? '#F1F3F2' : '#26282A', fg: s.f === f[0] ? '#0E0F10' : '#C9CFCC', pick: () => this.setState({ f: f[0] }) }))
    };
  }
}
</script>


</body></html>
