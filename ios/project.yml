name: DayDo
options:
  bundleIdPrefix: com.audichuang
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: zh-Hant
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: 37HFR5V2JJ
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  DayDoCore:
    path: ../DayDoCore
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    exactVersion: 9.2.0
targets:
  DayDo:
    type: application
    platform: iOS
    sources:
      - path: DayDo
    configFiles:
      Debug: Config.xcconfig
      Release: Config.xcconfig
    dependencies:
      - package: DayDoCore
      - package: GoogleSignIn
        product: GoogleSignIn
      - target: DayDoWidgets
        embed: true
    entitlements:
      path: DayDo/DayDo.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.audichuang.daydo
        com.apple.developer.applesignin:
          - Default
    info:
      path: DayDo/Info.plist
      properties:
        CFBundleDisplayName: DayDo
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        DayDoAccessClientId: $(DAYDO_ACCESS_CLIENT_ID)
        DayDoAccessClientSecret: $(DAYDO_ACCESS_CLIENT_SECRET)
        GIDClientID: 710830841029-g836eiphrs51fm45f9fgtleg95foohv0.apps.googleusercontent.com
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - com.googleusercontent.apps.710830841029-g836eiphrs51fm45f9fgtleg95foohv0
          - CFBundleURLName: com.audichuang.daydo.invite
            CFBundleURLSchemes:
              - daydo
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchLogo
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.productivity
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.audichuang.daydo
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
  DayDoWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: DayDoWidgets
    dependencies:
      - package: DayDoCore
    entitlements:
      path: DayDoWidgets/DayDoWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.audichuang.daydo
    info:
      path: DayDoWidgets/Info.plist
      properties:
        CFBundleDisplayName: DayDo
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.audichuang.daydo.widgets
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
  DayDoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: DayDoTests
      - path: DayDoWidgets/Views
    dependencies:
      - target: DayDo
      - package: DayDoCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.audichuang.daydo.tests
        GENERATE_INFOPLIST_FILE: YES
  DayDoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: DayDoUITests
    dependencies:
      - target: DayDo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.audichuang.daydo.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  DayDo:
    build:
      targets:
        DayDo: all
        DayDoTests: [test]
        DayDoUITests: [test]
    test:
      targets:
        - DayDoTests
        - DayDoUITests
