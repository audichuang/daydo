name: DayDo
options:
  bundleIdPrefix: com.audichuang
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: zh-Hant
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: 37HFR5V2JJ
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  DayDoCore:
    path: ../DayDoCore
targets:
  DayDo:
    type: application
    platform: iOS
    sources:
      - path: DayDo
    dependencies:
      - package: DayDoCore
    entitlements:
      path: DayDo/DayDo.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.audichuang.daydo
    info:
      path: DayDo/Info.plist
      properties:
        CFBundleDisplayName: DayDo
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIUserInterfaceStyle: Dark
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.productivity
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.audichuang.daydo
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
  DayDoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: DayDoUITests
    dependencies:
      - target: DayDo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.audichuang.daydo.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  DayDo:
    build:
      targets:
        DayDo: all
        DayDoUITests: [test]
    test:
      targets:
        - DayDoUITests
